name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: [stable]
        include:
          # Oldest version allowed by engines.vscode in package.json.
          - os: ubuntu-latest
            vscode: 1.96.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          require-lockfile: true
          cache: true
      # `pnpm test` also type-checks, lints and builds through the `pretest` script.
      - run: xvfb-run -a pnpm test --code-version ${{ matrix.vscode }}
        if: runner.os == 'Linux'
      - run: pnpm test --code-version ${{ matrix.vscode }}
        if: runner.os != 'Linux'

  package:
    name: Package VSIX
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          require-lockfile: true
          cache: true
      - run: pnpm run package-vsix
      - uses: actions/upload-artifact@v7
        with:
          name: harborbrowser-vsix
          path: "*.vsix"
          if-no-files-found: error
